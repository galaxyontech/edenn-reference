[pytest]
testpaths = EdennCode
# Remote-provider tests need CI secrets, reach real infrastructure, and SPEND.
# They were selected by default, so an ordinary `pytest` run failed on a laptop
# and on any CI job without the secret set — which trains everyone to ignore a
# red suite. Opt in explicitly instead:  pytest -m remote_integration
addopts = -m "not remote_integration"
python_files = test_*.py *_test.py
markers =
    smoke: Small, fast, core-path validation tests for local filtering.
    production: Larger, more comprehensive validation tests for local filtering.
    remote_integration: Real remote-provider integration tests that require CI secrets.
